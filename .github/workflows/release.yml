name: release

on:
  push:
    tags:
      - 'fontless@*'
      - 'fontaine@*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🛠 Build project
        run: pnpm build

      - name: 📦 Release fontaine
        if: startsWith(github.ref, 'refs/tags/fontaine@')
        run: pnpm publish --no-git-checks
        working-directory: packages/fontaine

      - name: 📦 Release fontless
        if: startsWith(github.ref, 'refs/tags/fontless@')
        run: pnpm publish --no-git-checks
        working-directory: packages/fontless

      - run: pnpm changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
