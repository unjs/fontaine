name: release

on:
  push:
    tags:
      - 'fontless@*'
      - 'fontaine@*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🛠 Build project
        run: pnpm build

      - name: 📦 Release fontaine
        if: startsWith(github.ref, 'refs/tags/fontaine@')
        run: pnpm publish --no-git-checks
        working-directory: packages/fontaine

      - name: 📦 Release fontless
        if: startsWith(github.ref, 'refs/tags/fontless@')
        run: pnpm publish --no-git-checks
        working-directory: packages/fontless

      - run: pnpm changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
