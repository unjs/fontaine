minimumReleaseAgeExclude:
  - unifont
  - fontless

shellEmulator: true

packages:
  - packages/*
  - packages/fontaine/playground
  - packages/fontless/docs
  - packages/fontless/examples/*

overrides:
  '@nuxt/fonts>fontaine': latest
  # `fontless: workspace:*` below would otherwise link the workspace copy into
  # `@nuxt/fonts`, which depends on `fontless@^0.2.1`. `latest` broke once 0.3.0 dropped
  # `resolveMinifyCssEsbuildOptions`, so track the range `@nuxt/fonts` declares instead.
  '@nuxt/fonts>fontless': ^0.2.1
  fontaine: 'workspace:*'
  fontless: 'workspace:*'
  unstorage: 1.17.5
  vue: 3.5.43

packageExtensions:
  # Imports `h3` without declaring it, so would otherwise pick up whichever major is hoisted
  '@analogjs/vite-plugin-nitro':
    dependencies:
      h3: ^1.15.11

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  shadcn-docs-nuxt: true
  sharp: false
  simple-git-hooks: true
  vue-demi: false
