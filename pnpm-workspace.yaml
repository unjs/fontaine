minimumReleaseAgeExclude:
  - unifont
  - fontless

shellEmulator: true

packages:
  - packages/*
  - packages/fontaine/playground
  - packages/fontless/docs
  - packages/fontless/examples/*

overrides:
  fontaine: 'workspace:*'
  fontless: 'workspace:*'
  shadcn-docs-nuxt>@nuxt/fonts: ^1.0.1
  unstorage: 1.17.5
  vue: 3.5.44

packageExtensions:
  # Imports `h3` without declaring it, so would otherwise pick up whichever major is hoisted
  '@analogjs/vite-plugin-nitro':
    dependencies:
      h3: ^1.15.11

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  shadcn-docs-nuxt: true
  sharp: false
  simple-git-hooks: true
  vue-demi: false
